- main:
  - img "BikeNetKit"
  - heading "The digital toolkit for bicycle networks" [level=1]
  - paragraph: Free, open-source Python tools for designing well-connected bicycle infrastructure.
  - paragraph:
    - link "© OpenStreetMap contributors":
      - /url: /legal
  - paragraph:
    - text: Most cities
    - strong: don't provide enough space to bike safely
    - text: ", despite the massive demand for cycling and benefits for climate, public health, and city life."
  - paragraph:
    - text: /Since \d+, we have been researching/
    - strong: new computational methods
    - text: for
    - strong: growing and fixing bicycle networks
    - text: . But these were prototypes, too rough for practical use.
  - paragraph:
    - text: BikeNetKit turns them into polished,
    - strong: free & open-source
    - text: software tools. Urban planners and citizens can run them on their own city with their own data, exploring many scenarios to make safe cycling happen. Read more in our
    - link "FAQ (opens in new tab)":
      - /url: https://faq.bikenetkit.org
    - text: .
